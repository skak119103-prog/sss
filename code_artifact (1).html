<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lshgaka의 개인 블로그</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Pretendard', sans-serif; }
    .glass-effect {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Header / Navigation -->
  <header class="sticky top-0 z-40 glass-effect border-b border-slate-200 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('posts')">
        <div class="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-xl shadow-md">
          L
        </div>
        <div>
          <h1 class="text-xl font-bold text-slate-900 tracking-tight">lshgaka's Blog</h1>
          <p class="text-xs text-slate-500">개인 공간 & 방명록</p>
        </div>
      </div>

      <div class="flex items-center space-x-2 sm:space-x-3">
        <!-- Tab Buttons -->
        <button onclick="switchTab('posts')" id="nav-posts-btn" class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors bg-indigo-50 text-indigo-600">
          <i class="fa-regular fa-newspaper mr-1"></i> 포스트
        </button>
        <button onclick="switchTab('guestbook')" id="nav-gb-btn" class="px-3 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors">
          <i class="fa-regular fa-comments mr-1"></i> 방명록
        </button>

        <!-- Admin Post Add Button (Hidden by default) -->
        <button id="admin-add-post-btn" onclick="openPostModal()" class="hidden px-3 py-1.5 bg-emerald-600 text-white rounded-lg text-sm font-medium hover:bg-emerald-700 shadow-sm transition-all">
          <i class="fa-solid fa-pen-to-square mr-1"></i> 새 포스트
        </button>

        <!-- Login / Logout Button -->
        <button id="auth-btn" onclick="handleAuthClick()" class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-100 transition-colors">
          <i class="fa-solid fa-lock mr-1"></i> 로그인
        </button>
      </div>
    </div>
  </header>

  <!-- Admin Banner (Shows when logged in) -->
  <div id="admin-banner" class="hidden bg-indigo-900 text-indigo-100 px-4 py-2 text-xs sm:text-sm font-medium text-center shadow-inner flex justify-center items-center gap-2">
    <span><i class="fa-solid fa-user-shield text-indigo-300"></i> 관리자(lshgaka) 모드로 로그인되어 있습니다. (포스트 작성/수정/삭제 및 방명록 자유 삭제 가능)</span>
  </div>

  <!-- Main Content Container -->
  <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8">

    <!-- TAB 1: Posts Section -->
    <section id="posts-tab" class="space-y-6">
      <div class="flex justify-between items-center border-b border-slate-200 pb-4">
        <h2 class="text-2xl font-bold text-slate-900">블로그 글</h2>
        <span id="post-count" class="text-sm text-slate-500">총 0개의 글</span>
      </div>

      <!-- Post List Container -->
      <div id="posts-list" class="grid gap-6">
        <!-- Posts injected via JS -->
      </div>
    </section>

    <!-- TAB 2: Guestbook Section -->
    <section id="guestbook-tab" class="hidden space-y-6">
      <div class="border-b border-slate-200 pb-4">
        <h2 class="text-2xl font-bold text-slate-900">방명록</h2>
        <p class="text-sm text-slate-500">누구나 자유롭게 메시지를 남길 수 있습니다.</p>
      </div>

      <!-- Guestbook Form -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
        <form id="gb-form" onsubmit="submitGuestbook(event)" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">작성자 이름 *</label>
              <input type="text" id="gb-author" required placeholder="이름 또는 닉네임" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">삭제 비밀번호 *</label>
              <input type="password" id="gb-pw" required placeholder="삭제 시 필요한 비밀번호" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">내용 *</label>
            <textarea id="gb-content" rows="3" required placeholder="따뜻한 한마디를 남겨주세요." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"></textarea>
          </div>
          <div class="flex justify-end">
            <button type="submit" class="px-5 py-2 bg-indigo-600 text-white font-medium text-sm rounded-lg hover:bg-indigo-700 shadow-sm transition-all">
              <i class="fa-solid fa-paper-plane mr-1"></i> 방명록 등록
            </button>
          </div>
        </form>
      </div>

      <!-- Guestbook List -->
      <div id="gb-list" class="space-y-4">
        <!-- Guestbook Items injected via JS -->
      </div>
    </section>

  </main>

  <!-- Login Modal -->
  <div id="login-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-lg font-bold text-slate-900"><i class="fa-solid fa-user-gear mr-2 text-indigo-600"></i>관리자 로그인</h3>
        <button onclick="closeLoginModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">아이디</label>
          <input type="text" id="login-id" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">비밀번호</label>
          <input type="password" id="login-pw" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <button type="submit" class="w-full py-2.5 bg-indigo-600 text-white font-medium rounded-lg text-sm hover:bg-indigo-700 transition-all shadow-md">
          로그인
        </button>
      </form>
    </div>
  </div>

  <!-- Write/Edit Post Modal (Admin Only) -->
  <div id="post-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 id="post-modal-title" class="text-lg font-bold text-slate-900">새 포스트 작성</h3>
        <button onclick="closePostModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form onsubmit="savePost(event)" class="space-y-4">
        <input type="hidden" id="edit-post-id">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">제목 *</label>
          <input type="text" id="post-title-input" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">이미지 첨부 (택 1)</label>
          <div class="space-y-2">
            <div>
              <span class="text-xs text-slate-400">1. 파일 업로드:</span>
              <input type="file" id="post-file-input" accept="image/*" onchange="handleFileSelect(event)" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
            </div>
            <div>
              <span class="text-xs text-slate-400">2. 또는 이미지 URL 주소:</span>
              <input type="url" id="post-url-input" placeholder="https://example.com/image.jpg" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
          </div>
          <div id="image-preview-box" class="mt-2 hidden">
            <p class="text-xs text-slate-400 mb-1">이미지 미리보기:</p>
            <img id="image-preview" src="" class="max-h-40 rounded-lg border object-cover">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">내용 *</label>
          <textarea id="post-content-input" rows="6" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none resize-none"></textarea>
        </div>

        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="closePostModal()" class="px-4 py-2 border rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">취소</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 shadow-sm">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="bg-white border-t border-slate-200 mt-auto py-6">
    <div class="max-w-4xl mx-auto px-4 text-center text-xs text-slate-400">
      &copy; lshgaka Blog. All rights reserved.
    </div>
  </footer>

  <script>
    // System State
    let isAdmin = false;
    let posts = JSON.parse(localStorage.getItem('lsh_posts')) || [];
    let guestbook = JSON.parse(localStorage.getItem('lsh_gb')) || [];
    let currentUploadedBase64 = '';

    // Initial Seed Data if empty
    if (posts.length === 0) {
      posts = [{
        id: Date.now(),
        title: '블로그를 개설했습니다! 🎉',
        content: '안녕하세요! lshgaka의 개인 블로그입니다.\n사진과 글을 업로드하며 소통하는 공간입니다.\n방명록도 남겨주세요!',
        image: 'https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=800&q=80',
        date: new Date().toLocaleDateString('ko-KR')
      }];
      localStorage.setItem('lsh_posts', JSON.stringify(posts));
    }

    // Tab Switcher
    function switchTab(tab) {
      const postsTab = document.getElementById('posts-tab');
      const gbTab = document.getElementById('guestbook-tab');
      const navPostsBtn = document.getElementById('nav-posts-btn');
      const navGbBtn = document.getElementById('nav-gb-btn');

      if (tab === 'posts') {
        postsTab.classList.remove('hidden');
        gbTab.classList.add('hidden');
        navPostsBtn.className = 'px-3 py-1.5 rounded-lg text-sm font-medium transition-colors bg-indigo-50 text-indigo-600';
        navGbBtn.className = 'px-3 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors';
      } else {
        postsTab.classList.add('hidden');
        gbTab.classList.remove('hidden');
        navPostsBtn.className = 'px-3 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors';
        navGbBtn.className = 'px-3 py-1.5 rounded-lg text-sm font-medium transition-colors bg-indigo-50 text-indigo-600';
      }
    }

    // Render Posts
    function renderPosts() {
      const container = document.getElementById('posts-list');
      document.getElementById('post-count').innerText = `총 ${posts.length}개의 글`;

      if (posts.length === 0) {
        container.innerHTML = `<div class="bg-white rounded-xl p-8 text-center text-slate-400 border border-slate-200">등록된 포스트가 없습니다.</div>`;
        return;
      }

      container.innerHTML = posts.map(post => `
        <article class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden transition-all hover:shadow-md">
          ${post.image ? `<img src="${post.image}" class="w-full max-h-96 object-cover bg-slate-100" alt="Post image">` : ''}
          <div class="p-6 space-y-3">
            <div class="flex justify-between items-start">
              <h3 class="text-xl font-bold text-slate-900 leading-snug">${escapeHtml(post.title)}</h3>
              ${isAdmin ? `
                <div class="flex space-x-1 ml-2">
                  <button onclick="editPost(${post.id})" class="p-1.5 text-xs text-slate-500 hover:text-indigo-600 rounded"><i class="fa-solid fa-pen"></i></button>
                  <button onclick="deletePost(${post.id})" class="p-1.5 text-xs text-slate-500 hover:text-rose-600 rounded"><i class="fa-solid fa-trash"></i></button>
                </div>
              ` : ''}
            </div>
            <p class="text-slate-600 text-sm whitespace-pre-line leading-relaxed">${escapeHtml(post.content)}</p>
            <div class="pt-2 text-xs text-slate-400 border-t border-slate-100 flex items-center justify-between">
              <span>${post.date}</span>
              <span>By lshgaka</span>
            </div>
          </div>
        </article>
      `).join('');
    }

    // Render Guestbook
    function renderGuestbook() {
      const container = document.getElementById('gb-list');
      if (guestbook.length === 0) {
        container.innerHTML = `<div class="bg-white rounded-xl p-8 text-center text-slate-400 border border-slate-200">아직 방명록이 없습니다. 첫 방명록을 남겨보세요!</div>`;
        return;
      }

      container.innerHTML = guestbook.map(item => `
        <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-200 space-y-2">
          <div class="flex justify-between items-center">
            <div class="flex items-center space-x-2">
              <span class="font-bold text-sm text-slate-800">${escapeHtml(item.author)}</span>
              <span class="text-xs text-slate-400">${item.date}</span>
            </div>
            <button onclick="deleteGuestbook(${item.id})" class="text-slate-400 hover:text-rose-600 text-xs px-2 py-1 rounded transition-colors" title="삭제">
              <i class="fa-solid fa-trash mr-1"></i>삭제
            </button>
          </div>
          <p class="text-slate-700 text-sm whitespace-pre-line">${escapeHtml(item.content)}</p>
        </div>
      `).join('');
    }

    // Admin Auth
    function handleAuthClick() {
      if (isAdmin) {
        // Logout
        isAdmin = false;
        updateUIForAdmin();
        alert('로그아웃되었습니다.');
      } else {
        document.getElementById('login-modal').classList.remove('hidden');
      }
    }

    function closeLoginModal() {
      document.getElementById('login-modal').classList.add('hidden');
    }

    function handleLogin(e) {
      e.preventDefault();
      const id = document.getElementById('login-id').value;
      const pw = document.getElementById('login-pw').value;

      if (id === 'lshgaka' && pw === 'lsh0803!') {
        isAdmin = true;
        closeLoginModal();
        document.getElementById('login-id').value = '';
        document.getElementById('login-pw').value = '';
        updateUIForAdmin();
        alert('관리자로 로그인되었습니다!');
      } else {
        alert('아이디 또는 비밀번호가 올바르지 않습니다.');
      }
    }

    function updateUIForAdmin() {
      const authBtn = document.getElementById('auth-btn');
      const banner = document.getElementById('admin-banner');
      const addBtn = document.getElementById('admin-add-post-btn');

      if (isAdmin) {
        authBtn.innerHTML = `<i class="fa-solid fa-right-from-bracket mr-1"></i> 로그아웃`;
        banner.classList.remove('hidden');
        addBtn.classList.remove('hidden');
      } else {
        authBtn.innerHTML = `<i class="fa-solid fa-lock mr-1"></i> 로그인`;
        banner.classList.add('hidden');
        addBtn.classList.add('hidden');
      }
      renderPosts();
    }

    // Post Modal Controls
    function openPostModal() {
      document.getElementById('post-modal-title').innerText = '새 포스트 작성';
      document.getElementById('edit-post-id').value = '';
      document.getElementById('post-title-input').value = '';
      document.getElementById('post-content-input').value = '';
      document.getElementById('post-url-input').value = '';
      document.getElementById('post-file-input').value = '';
      document.getElementById('image-preview-box').classList.add('hidden');
      currentUploadedBase64 = '';
      document.getElementById('post-modal').classList.remove('hidden');
    }

    function closePostModal() {
      document.getElementById('post-modal').classList.add('hidden');
    }

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          currentUploadedBase64 = evt.target.result;
          document.getElementById('image-preview').src = currentUploadedBase64;
          document.getElementById('image-preview-box').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    function savePost(e) {
      e.preventDefault();
      const editId = document.getElementById('edit-post-id').value;
      const title = document.getElementById('post-title-input').value;
      const content = document.getElementById('post-content-input').value;
      const urlImg = document.getElementById('post-url-input').value;

      let finalImg = currentUploadedBase64 || urlImg || '';

      if (editId) {
        // Edit existing
        const index = posts.findIndex(p => p.id == editId);
        if (index !== -1) {
          posts[index].title = title;
          posts[index].content = content;
          if (finalImg) posts[index].image = finalImg;
        }
      } else {
        // Add new
        const newPost = {
          id: Date.now(),
          title: title,
          content: content,
          image: finalImg,
          date: new Date().toLocaleDateString('ko-KR')
        };
        posts.unshift(newPost);
      }

      localStorage.setItem('lsh_posts', JSON.stringify(posts));
      closePostModal();
      renderPosts();
    }

    function editPost(id) {
      const post = posts.find(p => p.id === id);
      if (!post) return;

      document.getElementById('post-modal-title').innerText = '포스트 수정';
      document.getElementById('edit-post-id').value = post.id;
      document.getElementById('post-title-input').value = post.title;
      document.getElementById('post-content-input').value = post.content;
      document.getElementById('post-url-input').value = post.image || '';
      
      if (post.image) {
        document.getElementById('image-preview').src = post.image;
        document.getElementById('image-preview-box').classList.remove('hidden');
      } else {
        document.getElementById('image-preview-box').classList.add('hidden');
      }

      document.getElementById('post-modal').classList.remove('hidden');
    }

    function deletePost(id) {
      if (confirm('이 포스트를 정말 삭제하시겠습니까?')) {
        posts = posts.filter(p => p.id !== id);
        localStorage.setItem('lsh_posts', JSON.stringify(posts));
        renderPosts();
      }
    }

    // Guestbook Logic
    function submitGuestbook(e) {
      e.preventDefault();
      const author = document.getElementById('gb-author').value;
      const pw = document.getElementById('gb-pw').value;
      const content = document.getElementById('gb-content').value;

      const newItem = {
        id: Date.now(),
        author: author,
        pw: pw,
        content: content,
        date: new Date().toLocaleDateString('ko-KR') + ' ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
      };

      guestbook.unshift(newItem);
      localStorage.setItem('lsh_gb', JSON.stringify(guestbook));

      document.getElementById('gb-author').value = '';
      document.getElementById('gb-pw').value = '';
      document.getElementById('gb-content').value = '';

      renderGuestbook();
      alert('방명록이 등록되었습니다.');
    }

    // Guestbook Delete Logic (Strict Auth Requirement)
    function deleteGuestbook(id) {
      const item = guestbook.find(g => g.id === id);
      if (!item) return;

      // 1. If Logged in as Admin: Bypass password check
      if (isAdmin) {
        if (confirm('관리자 권한으로 이 방명록을 삭제하시겠습니까?')) {
          guestbook = guestbook.filter(g => g.id !== id);
          localStorage.setItem('lsh_gb', JSON.stringify(guestbook));
          renderGuestbook();
        }
        return;
      }

      // 2. Regular Visitors: MUST enter correct password
      const inputPw = prompt('방명록 작성 시 입력했던 비밀번호를 입력해주세요:');
      
      if (inputPw === null) return; // Clicked cancel

      if (inputPw === item.pw) {
        guestbook = guestbook.filter(g => g.id !== id);
        localStorage.setItem('lsh_gb', JSON.stringify(guestbook));
        renderGuestbook();
        alert('방명록이 삭제되었습니다.');
      } else {
        alert('비밀번호가 일치하지 않습니다. 삭제할 수 없습니다.');
      }
    }

    // Helper: Escape HTML to prevent XSS
    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Init
    renderPosts();
    renderGuestbook();
    function submitGuestbook(e) {
  e.preventDefault();
  const author = document.getElementById('gb-author').value.trim();
  const pw = document.getElementById('gb-pw').value.trim(); // trim()을 통해 공백 제거
  const content = document.getElementById('gb-content').value.trim();

  // 비밀번호가 빈 값이거나 공백만 입력된 경우 차단
  if (!pw) {
    alert('삭제 비밀번호를 반드시 입력해 주세요!');
    document.getElementById('gb-pw').focus();
    return;
  }

  const newItem = {
    id: Date.now(),
    author: author,
    pw: pw,
    content: content,
    date: new Date().toLocaleDateString('ko-KR') + ' ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
  };

  guestbook.unshift(newItem);
  localStorage.setItem('lsh_gb', JSON.stringify(guestbook));

  document.getElementById('gb-author').value = '';
  document.getElementById('gb-pw').value = '';
  document.getElementById('gb-content').value = '';

  renderGuestbook();
  alert('방명록이 등록되었습니다.');
}
  </script>
</body>
</html>
